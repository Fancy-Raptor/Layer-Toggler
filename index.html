<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Layer Toggle Extension</title>
</head>
<body>
  <div style="font-family: sans-serif; padding: 10px; color: white;">
    <p>⚡ <strong>Layer Toggler is Active!</strong></p>
    <p style="font-size: 0.85em; opacity: 0.8;">Select any item on the grid and click the new layer button on its action bar.</p>
  </div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk";

    OBR.onReady(() => {
      // Create context menu button on selected items
      OBR.contextMenu.create({
        id: "com.layer-toggler/toggle",
        icons: [
          {
            icon: "/layers.svg",
            label: "Toggle Prop / Attachment Layer",
          }
        ],
        async onClick(context) {
          // Toggle layer between PROP and ATTACHMENT
          const updates = context.items.map((item) => ({
            id: item.id,
            layer: item.layer === "PROP" ? "ATTACHMENT" : "PROP",
          }));

          await OBR.scene.items.updateItems(updates);
        }
      });
    });
  </script>
</body>
</html>
